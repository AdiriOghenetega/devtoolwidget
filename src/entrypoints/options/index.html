<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devToolWidget settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 720px;
      }
      .dwt-options__note {
        opacity: 0.75;
      }
      .dwt-options__sites {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .dwt-options__sites li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .dwt-options__status {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
