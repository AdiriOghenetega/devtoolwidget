name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency check
        run: pnpm deps:check
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build (Chrome)
        run: pnpm build
      - name: Build (Firefox)
        run: pnpm build:firefox
      - name: Size budgets
        run: pnpm size
